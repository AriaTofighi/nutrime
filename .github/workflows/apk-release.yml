name: Build APK release

# Manual release: Actions -> Build APK release -> Run workflow (on main).
# Needs the repository secrets NUTRIME_KEYSTORE_BASE64 and NUTRIME_KEYSTORE_PASSWORD
# (optional: NUTRIME_KEY_ALIAS, NUTRIME_KEY_PASSWORD) and the repository variable
# NUTRIME_SERVER_URL (the sync server the app talks to).
on:
  workflow_dispatch:

permissions:
  contents: write

# Keep build and publication together; do not interrupt an active release.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release version
        # versionCode must keep increasing across releases. 1100+ keeps it above the builds from the
        # earlier repository (the last was 1006), because this repository's run number started again at 1.
        run: |
          echo "NUTRIME_BUILD_NUMBER=$((1100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUTRIME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Set the NUTRIME_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NUTRIME_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          NUTRIME_KEYSTORE_PASSWORD: ${{ secrets.NUTRIME_KEYSTORE_PASSWORD }}
          NUTRIME_KEY_ALIAS: ${{ secrets.NUTRIME_KEY_ALIAS }}
          NUTRIME_KEY_PASSWORD: ${{ secrets.NUTRIME_KEY_PASSWORD }}
          NUTRIME_SERVER_URL: ${{ vars.NUTRIME_SERVER_URL }}
        run: |
          if [ -z "$NUTRIME_SERVER_URL" ]; then echo "::error::Set the NUTRIME_SERVER_URL repository variable"; exit 1; fi
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect
        run: cp app/build/outputs/apk/release/app-release.apk nutrime.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ env.NUTRIME_BUILD_NUMBER }}
          name: NutriMe ${{ env.APP_VERSION }} (build ${{ env.NUTRIME_BUILD_NUMBER }})
          target_commitish: ${{ github.sha }}
          files: nutrime.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 1
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' \
            | tail -n +$((KEEP + 1)) \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes -R "${{ github.repository }}"; done
